name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs run side by side, so a run takes as long as the slowest of them.
# Each keeps its compiled dependencies between runs: a run compiles this
# repository's own crates and nothing else, unless Cargo.lock or the
# toolchain changed.
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --check
      # The profiles in the workspace's Cargo.toml decide how dependencies are
      # compiled, and the action does not look at that file: without this, a
      # change there would leave compiled dependencies that no build can use.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests turn on `soundrts-world/truth`, which gives the whole world
      # and names the simulation's `Entity`. Built without them, the
      # interface must read the game only through what its player knows,
      # and entities only as `KnownEntity`.
      - name: Build the interface without the whole world
        run: cargo check -p soundrts --lib --bins

  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      # The script builds the importer and runs it, so it comes after the
      # compiled dependencies are restored.
      - name: Fetch the original game and import it
        shell: pwsh
        run: ./scripts/fetch-upstream.ps1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest runs every test in its own process, several at a time across
      # the test programs. `cargo test` runs the programs one after another.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast
      # nextest does not run documentation tests.
      - name: Test the documentation
        run: cargo test --workspace --doc
      # A line of the port's language files that is not one of its phrases
      # fails the tests. What each language still lacks is only reported.
      - name: Report the phrases each language lacks
        run: cargo run -p soundrts -- --root vendor/game-data --untranslated all

  # The simulation and the server must also build and pass on Linux, where
  # a server is likely to run. The client needs Windows.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Fetch the original game and import it
        shell: pwsh
        run: ./scripts/fetch-upstream.ps1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test the simulation, the importer, the protocol and the server
        run: cargo nextest run -p soundrts-world -p soundrts-import -p soundrts-protocol -p soundrts-server --no-fail-fast
      - name: Test the documentation
        run: cargo test -p soundrts-world -p soundrts-import -p soundrts-protocol -p soundrts-server --doc
