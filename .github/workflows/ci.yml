name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the original game
        shell: pwsh
        run: ./scripts/fetch-upstream.ps1
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests turn on `soundrts-world/truth`, which gives the whole world.
      # Built without them, the interface must read the game only through
      # what its player knows.
      - name: Build the interface without the whole world
        run: cargo check -p soundrts --lib --bins
      - name: Test
        run: cargo test --workspace
