[package]
name = "soundrts-world"
description = "The SoundRTS game simulation: rules, maps, units, orders and computer players. No audio, no window, no file access."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `Host::world`, the whole world, and the simulation's `Entity`: for tests
# that check a game's results. The interface is built without it (see the
# CI workflow), so it reads the game only through what its player knows,
# and is told about entities only as `KnownEntity`.
truth = []
# The sendable form of what a seat is sent, and of a command and a game's
# set-up: `serde` traits on those types, and a game's record as a file.
# The simulation builds without it.
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
# `rc` sends the `Arc<str>` type names of `KnownEntity`.
serde = { version = "1", features = ["derive", "rc"], optional = true }
# A record's file is JSON lines. `float_roundtrip`: a number read back is
# the number written.
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[dev-dependencies]
# The tests read the whole world.
soundrts-world = { path = ".", features = ["truth", "serde"] }
