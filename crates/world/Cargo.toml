[package]
name = "soundrts-world"
description = "The SoundRTS game simulation: rules, maps, units, orders and computer players. No audio, no window, no file access."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `Host::world`, the whole world, and the simulation's `Entity`: for tests
# that check a game's results. The interface is built without it (see the
# CI workflow), so it reads the game only through what its player knows,
# and is told about entities only as `KnownEntity`.
truth = []

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[dev-dependencies]
# The tests read the whole world.
soundrts-world = { path = ".", features = ["truth"] }
