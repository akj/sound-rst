[package]
name = "soundrts"
description = "SoundRTS, a real-time strategy audio game: speech, positional sound, keyboard control and menus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The test kit: recording devices, a scripted keyboard and a harness on
# the upstream data. The crate's own tests enable it.
testkit = ["dep:tempfile"]

[dependencies]
soundrts-world = { path = "../world" }
soundrts-protocol = { path = "../protocol" }
soundrts-server = { path = "../server" }
soundrts-import = { path = "../import" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
# Encrypted connections (`wss://`): the TLS that ureq already brings, on
# ring, with the roots of trust built in (see `net::conn::Trust`).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1.0.10"
ureq = "3"
indexmap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"] }
sys-locale = "0.3"
tempfile = { version = "3", optional = true }
toml = "1"
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tolk = "0.5"
tolk-sys = "0.2"
# The same version winit uses, so it is built once.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
tts = "0.26"

[dev-dependencies]
soundrts = { path = ".", features = ["testkit"] }
# Certificates for the tests of encrypted connections, made in memory.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# The TLS proxy of those tests passes bytes both ways.
tokio = { version = "1.54.1", features = ["io-util"] }
# The tests check results in the whole world; the interface itself reads
# only what its player knows, and cannot name the simulation's `Entity`
# (see the CI workflow).
soundrts-world = { path = "../world", features = ["truth"] }
tempfile = "3"
