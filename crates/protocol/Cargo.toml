[package]
name = "soundrts-protocol"
description = "The messages between a SoundRTS client and a SoundRTS server, and the rules they both check."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read back is the number written.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# The game's own types, with their sendable form.
soundrts-world = { path = "../world", features = ["serde"] }
# The compact binary form of the game stream: see `game`.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The tests play whole games, which needs the whole world.
soundrts-world = { path = "../world", features = ["serde", "truth"] }
# The WebSocket's per-message compression, for the measurement of the
# game stream's encodings.
flate2 = "1.1.11"
