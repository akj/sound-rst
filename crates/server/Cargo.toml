[package]
name = "soundrts-server"
description = "The SoundRTS multiplayer server: a lobby, a chat and a turn clock, as a library to embed and a program."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
rand = "0.10.3"
serde_json = "1.0.154"
soundrts-protocol = { path = "../protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
