[package]
name = "listening-room"
description = "Plays the game's sounds through several renderers and asks the player what they hear."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The binaural renderer, on Steam Audio. The build downloads Steam Audio
# once (about 180 MB) and needs Clang.
binaural = ["dep:audionimbus", "dep:sha2", "dep:zip"]

[dependencies]
soundrts = { path = "../client" }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
audionimbus = { version = "0.17", default-features = false, features = ["linking-dynamic"], optional = true }

[build-dependencies]
sha2 = { version = "0.10", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3"
