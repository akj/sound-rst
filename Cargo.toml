[workspace]
resolver = "3"
members = ["crates/world", "crates/client", "crates/protocol", "crates/server", "crates/listening-room"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
# File and line numbers only: panics and backtraces are unchanged, a
# debugger cannot show variables, and build folders are under half the size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
